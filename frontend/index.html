<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title data-i18n="app.title">热更新模拟器</title>
</head>

<body>
    <div class="app-shell">
        <!-- 侧边导航 -->
        <aside class="hus-sidebar" id="husSidebar">
            <div class="hus-brand">
                <h1>
                    <i class="bi bi-arrow-repeat text-primary"></i>
                    <span data-i18n="app.title">热更新模拟器</span>
                </h1>
                <small data-i18n="app.subtitle">游戏热更新服务端模拟与故障注入</small>
            </div>

            <nav class="hus-nav nav flex-column" id="husNav">
                <a class="nav-link" data-route="dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span data-i18n="nav.dashboard">总览</span>
                </a>
                <a class="nav-link" data-route="network">
                    <i class="bi bi-wifi"></i>
                    <span data-i18n="nav.network">网络模拟</span>
                </a>
                <a class="nav-link" data-route="faults">
                    <i class="bi bi-lightning-charge"></i>
                    <span data-i18n="nav.faults">故障注入</span>
                </a>
                <a class="nav-link" data-route="presets">
                    <i class="bi bi-bookmarks"></i>
                    <span data-i18n="nav.presets">预置方案</span>
                </a>
                <a class="nav-link" data-route="logs">
                    <i class="bi bi-terminal"></i>
                    <span data-i18n="nav.logs">实时日志</span>
                </a>
                <a class="nav-link" data-route="explorer">
                    <i class="bi bi-send"></i>
                    <span data-i18n="nav.explorer">接口调试</span>
                </a>
                <a class="nav-link" data-route="favorites">
                    <i class="bi bi-star"></i>
                    <span data-i18n="nav.favorites">收藏</span>
                </a>
                <a class="nav-link" data-route="manual">
                    <i class="bi bi-book"></i>
                    <span data-i18n="nav.manual">使用手册</span>
                </a>
                <!-- API 文档是 swagger-ui 的独立页面，用新标签页打开：
                     否则会把正在用的面板导航走，而调试时经常要两边对着看。
                     没有 data-route，所以不会被侧栏的路由拦截。 -->
                <a class="nav-link" href="/docs" target="_blank" rel="noopener">
                    <i class="bi bi-braces"></i>
                    <span data-i18n="nav.apiDocs">API 文档</span>
                    <i class="bi bi-box-arrow-up-right ms-auto small opacity-50"></i>
                </a>
            </nav>

            <div class="hus-sidebar-footer">
                <div id="husFooterInfo" class="mono">—</div>
            </div>
        </aside>

        <div class="hus-main">
            <!-- 顶栏 -->
            <header class="hus-topbar">
                <button class="btn btn-sm btn-outline-secondary hus-sidebar-toggle" id="husSidebarToggle"
                    type="button" aria-label="菜单">
                    <i class="bi bi-list"></i>
                </button>

                <span id="husConnStatus" class="small">
                    <span class="status-dot warn"></span>
                    <span data-i18n="status.checking">检测中…</span>
                </span>

                <span id="husSimStatus" class="badge text-bg-secondary sim-indicator">
                    <i class="bi bi-slash-circle"></i>
                    <span data-i18n="status.idle">正常模式</span>
                </span>

                <span class="spacer"></span>

                <button class="btn btn-sm btn-danger" id="husPanicBtn" type="button"
                    data-i18n-title="status.panicHint">
                    <i class="bi bi-stop-circle"></i>
                    <span data-i18n="status.panic">急停</span>
                </button>

                <select class="form-select form-select-sm w-auto" id="husLocaleSelect" aria-label="Language">
                    <option value="zh-CN">中文</option>
                    <option value="en">English</option>
                </select>
            </header>

            <!-- 视图容器：由各视图模块填充 -->
            <main class="hus-view" id="husView"></main>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
